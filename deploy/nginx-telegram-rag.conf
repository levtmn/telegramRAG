server {
    listen 80;
    server_name rpi.local _;

    # Static landing page at http://rpi.local/
    root /var/www/telegram-rag;
    index landing.html;

    location = / {
        try_files /landing.html =404;
    }

    location = /telegram-rag.html {
        try_files /landing.html =404;
    }

    # Block direct access to internal files
    location ~ \.(py|env|pkl|json|db)$ {
        deny all;
    }
}
